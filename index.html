<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script Corrector - 口播稿智能校对与字幕工具</title>
    <meta name="description" content="基于 Gladia 语音转录与 Google Gemini 大模型双重标准审校的口播稿与字幕校对工具，支持西班牙语、法语、英语及标准 SRT/TXT 导出。" />
    <meta property="og:title" content="Script Corrector - 口播稿智能校对与字幕工具" />
    <meta property="og:description" content="基于 Gladia 语音转录与 Google Gemini 大模型双重标准审校的口播稿与字幕校对工具，支持西班牙语、法语、英语及标准 SRT/TXT 导出。" />
    <link rel="icon" type="image/jpeg" href="/script_corrector_icon.jpg" />
    <script>
      // Suppress unhandled WebSocket rejections from dev server HMR in preview environment
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason?.stack || event.reason?.message || event.reason || '');
        if (
          str.includes('WebSocket') || 
          str.includes('vite:ws') ||
          str.includes('@vite/client') ||
          str.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var str = String(event.error?.stack || event.message || event.filename || '');
        if (
          str.includes('WebSocket') || 
          str.includes('vite:ws') ||
          str.includes('@vite/client') ||
          str.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
